        body {

            background-color: #f3f4f6;
            transition: background-color 0.3s ease;
        }
        
        /* Dark Red Theme */
        body.dark-red-theme {
            background-color: #4b0000;
        }

        .card {
            background-color: #fff;
            transition: background-color 0.3s ease;
        }

        .dark-red-theme .card {
            background-color: #1f2937;
        }

        .card-title {
            color: #1f2937;
            transition: color 0.3s ease;
        }

        .dark-red-theme .card-title {
            color: #f3f4f6;
        }

        .card-designation {
            color: #3b82f6;
            transition: color 0.3s ease;
        }

        .dark-red-theme .card-designation {
            color: #ef4444;
        }

        .card-details {
            color: #6b7280;
            transition: color 0.3s ease;
        }
        
        .dark-red-theme .card-details {
            color: #d1d5db;
        }

    </style>

                </svg>
                <svg id="sun-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </header>

        <!-- Teacher Cards Grid -->

            <!-- Cards will be dynamically inserted here by JavaScript -->

        const teachersGrid = document.getElementById('teachersGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const moonIcon = document.getElementById('moon-icon');
        const sunIcon = document.getElementById('sun-icon');
        const headerText = document.querySelector('header h1');
        const headerParagraph = document.querySelector('header p');

        // Function to render teacher cards
        function renderTeachers(filteredTeachers) {
            teachersGrid.innerHTML = ''; // Clear the grid
            if (filteredTeachers.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                filteredTeachers.forEach(teacher => {
                    const card = document.createElement('div');
                    card.classList.add('card', 'rounded-xl', 'shadow-md', 'p-6', 'flex', 'flex-col', 'items-center', 'text-center', 'transform', 'transition', 'duration-300', 'hover:scale-105', 'hover:shadow-lg');

                    card.innerHTML = `
                        <img src="${teacher.photo}" alt="${teacher.name}" class="w-24 h-24 rounded-full mb-4 object-cover border-4 border-blue-500">
                        <h2 class="card-title text-xl font-semibold">${teacher.name}</h2>
                        <p class="card-designation font-medium">${teacher.designation}</p>
                        <p class="card-details text-sm mt-1">${teacher.department}</p>
                        <div class="mt-4 card-details text-sm">
                            <p><strong>Mobile:</strong> <a href="tel:${teacher.mobile}" class="hover:text-blue-500">${teacher.mobile}</a></p>
                            <p><strong>Email:</strong> <a href="mailto:${teacher.email}" class="hover:text-blue-500">${teacher.email}</a></p>
                        </div>
                    `;
                    teachersGrid.appendChild(card);
                });
            }
        }

        // Function to filter teachers based on search input
        function filterTeachers() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredTeachers = teachers.filter(teacher =>
                teacher.name.toLowerCase().includes(searchTerm) ||
                teacher.designation.toLowerCase().includes(searchTerm)
            );
            renderTeachers(filteredTeachers);
        }

        // Theme toggle functionality
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-red-theme');
            
            // Toggle icons
            if (body.classList.contains('dark-red-theme')) {
                moonIcon.classList.add('hidden');
                sunIcon.classList.remove('hidden');
                headerText.classList.remove('text-gray-800');
                headerText.classList.add('text-gray-100');
                headerParagraph.classList.remove('text-gray-600');
                headerParagraph.classList.add('text-gray-400');
                searchInput.classList.add('bg-gray-700', 'text-white', 'border-gray-600');
                noResults.classList.remove('text-gray-500');
                noResults.classList.add('text-gray-400');
            } else {
                moonIcon.classList.remove('hidden');
                sunIcon.classList.add('hidden');
                headerText.classList.remove('text-gray-100');
                headerText.classList.add('text-gray-800');
                headerParagraph.classList.remove('text-gray-400');
                headerParagraph.classList.add('text-gray-600');
                searchInput.classList.remove('bg-gray-700', 'text-white', 'border-gray-600');
                noResults.classList.remove('text-gray-400');
                noResults.classList.add('text-gray-500');
            }
        });

        // Initial render
        renderTeachers(teachers);

        // Add event listener to search input
        searchInput.addEventListener('input', filterTeachers);
