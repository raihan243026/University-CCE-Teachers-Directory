<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University CCE Teachers Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        /* Theme Definitions */
        .theme-white { --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --subtext: #4b5563; --accent: #2563eb; --border: #e5e7eb; }
        .theme-dark-red { --bg: #450a0a; --card: #7f1d1d; --text: #fef2f2; --subtext: #fca5a5; --accent: #f87171; --border: #991b1b; }
        .theme-dark-black { --bg: #0a0a0a; --card: #171717; --text: #ededed; --subtext: #a3a3a3; --accent: #3b82f6; --border: #262626; }

        body { background-color: var(--bg); color: var(--text); }
        .card { background-color: var(--card); border: 1px solid var(--border); }
        .nav-bg { background-color: var(--card); border-bottom: 1px solid var(--border); }
        .accent-text { color: var(--accent); }
        .sub-text { color: var(--subtext); }
        
        .sticky-nav { position: sticky; top: 0; z-index: 50; }
        
        .search-input {
            background-color: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
        }
        
        .search-input:focus {
            ring: 2px solid var(--accent);
            outline: none;
        }

        .category-badge {
            background-color: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: bold;
        }
    </style>
</head>
<body class="theme-white">

    <!-- Navigation Bar -->
    <nav class="nav-bg sticky-nav px-4 py-3 shadow-sm">
        <div class="container mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 p-2 rounded-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
                </div>
                <span class="text-xl font-bold tracking-tight">CCE Teachers Directory</span>
            </div>

            <!-- Search Area -->
            <div class="relative w-full max-w-md">
                <input type="text" id="searchInput" placeholder="Search name, designation, or short name..." 
                       class="search-input w-full pl-10 pr-4 py-2 rounded-full text-sm">
                <svg class="w-5 h-5 absolute left-3 top-2.5 sub-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>

            <!-- Theme Toggle -->
            <button id="themeToggle" class="p-2 rounded-full hover:bg-opacity-20 hover:bg-gray-500 transition-all flex items-center gap-2 border border-gray-400 border-opacity-30">
                <span id="themeLabel" class="text-xs font-medium uppercase hidden sm:inline">Theme</span>
                <svg id="themeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path id="iconPath" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="container mx-auto p-4 md:p-8">
        <div class="mb-10 text-center">
            <h2 class="text-3xl font-extrabold mb-2">Department Faculty</h2>
            <div class="h-1 w-20 bg-blue-600 mx-auto rounded-full"></div>
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap justify-center gap-2 mb-8">
            <button onclick="filterCategory('all')" class="category-btn active px-4 py-1.5 rounded-full bg-blue-600 text-white text-sm font-medium transition">All</button>
            <button onclick="filterCategory('Regular')" class="category-btn px-4 py-1.5 rounded-full border border-gray-400 border-opacity-30 text-sm font-medium transition">Regular</button>
            <button onclick="filterCategory('Adjunct')" class="category-btn px-4 py-1.5 rounded-full border border-gray-400 border-opacity-30 text-sm font-medium transition">Adjunct</button>
        </div>

        <div id="teachersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards populated by JS -->
        </div>

        <div id="noResults" class="hidden text-center py-20">
            <svg class="mx-auto h-12 w-12 sub-text mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h3 class="text-xl font-semibold">No matches found</h3>
            <p class="sub-text">Try adjusting your search or filters.</p>
        </div>
    </main>

    <script>
        const facultyData = [
            // Regular Faculty

            { name: "Dr. Mohammed Saifuddin", designation: "Assistant Professor", short: "DMS", mobile: "01945167849", type: "Regular" },
            { name: "Engr. MD Jiabul Hoque", designation: "Assistant Professor", short: "MJH", mobile: "01989685996", type: "Regular" },
            { name: "Mr Amanul Hoque", designation: "Lecturer", short: "AH", mobile: "01818673657", type: "Regular" },
            { name: "Ms Tania Sultana", designation: "Lecturer", short: "TS", mobile: "01515284723", type: "Regular" },
            { name: "Engr. Hassan Jaki", designation: "Lecturer", short: "HJ", mobile: "01825362202", type: "Regular" },
            { name: "Ms Jannatul Naima", designation: "Lecturer", short: "JN", mobile: "01624924499", type: "Regular" },
            { name: "Md. Hasan Mia", designation: "Lecturer", short: "HM", mobile: "01787917221", type: "Regular" },
            { name: "Mr Mirza Raquib", designation: "Lecturer", short: "MR", mobile: "01319034382", type: "Regular" },
            { name: "Atia Jahan", designation: "Lecturer", short: "AJ", mobile: "01400388302", type: "Regular" },
            { name: "Md Nurnobi Chowdhury Saddam", designation: "Lecturer", short: "NCS", mobile: "01558268715", type: "Regular" },
            { name: "Mr Abdullah Al Masud", designation: "Lecturer", short: "AAM", mobile: "01719801221", type: "Regular" },
            { name: "Md. Imam Uddin Forkan", designation: "Lecturer", short: "IUF", mobile: "01521536448", type: "Regular" },

            // Adjunct Faculty
            { name: "Dr. Md. Azad Hossain", designation: "Professor, ETE, CUET", short: "DMAH", mobile: "01783756981", type: "Adjunct" },
            { name: "Dr. Md. Jahedul Islam", designation: "Professor, ETE, CUET", short: "DMJI", mobile: "01792451681", type: "Adjunct" },
            { name: "Dr. Md. Golam Hafez", designation: "Professor, Mathematics, CUET", short: "DMGH", mobile: "01712340602", type: "Adjunct" },
            { name: "Dr. Md. Saiful Islam", designation: "Associate Professor, ETE, CUET", short: "DMSI", mobile: "01840066254", type: "Adjunct" },
            { name: "Md. Kamal Hossen", designation: "Associate Professor, CSE, CUET", short: "MKH", mobile: "01816012649", type: "Adjunct" },
            { name: "Md. Shahidul Hoque", designation: "Associate Professor, CU", short: "MSH", mobile: "01818921964", type: "Adjunct" },
            { name: "Md Riyad Hossain", designation: "Lecturer, EEE, UCTC", short: "MRH", mobile: "01631187291", type: "Adjunct" },
            { name: "Md. Ayubali", designation: "Adjunct Faculty, CCE, IIUC", short: "MA", mobile: "01864792153", type: "Adjunct" },
            { name: "Mr. Syed Mainul Islam", designation: "Adjunct Faculty, CCE, IIUC", short: "SMI", mobile: "01521488497", type: "Adjunct" },
            { name: "Mohammad Istiak Khan", designation: "Adjunct Faculty, CCE, IIUC", short: "MIK", mobile: "01625142108", type: "Adjunct" },
            { name: "Md. Warid Bin Azad", designation: "Adjunct Faculty, CCE, IIUC", short: "MWBA", mobile: "01671911645", type: "Adjunct" },
            { name: "Mr. Abu Noman Siddike", designation: "Adjunct Faculty, CCE, IIUC", short: "ANS", mobile: "01741270048", type: "Adjunct" },
            { name: "Abu Raihan Anchari Miskat", designation: "Adjunct Faculty, CCE, IIUC", short: "ARAM", mobile: "01871582887", type: "Adjunct" },
            { name: "Zia Uddin Ahmed", designation: "Adjunct Faculty, CCE, IIUC", short: "ZUA", mobile: "01670502610", type: "Adjunct" },
            { name: "Md Abu Bakar Siddiq Sayem", designation: "Adjunct Faculty, CCE, IIUC", short: "MABSS", mobile: "01825507837", type: "Adjunct" },
            { name: "Arafat Al Fahim", designation: "Adjunct Faculty, CCE, IIUC", short: "AAF", mobile: "01866695182", type: "Adjunct" },
            { name: "Md Hasan Shorif", designation: "Adjunct Faculty, CCE, IIUC", short: "MHS", mobile: "01858562734", type: "Adjunct" },
            { name: "Afif Hossain Irfan", designation: "Adjunct Faculty, CCE, IIUC", short: "AHI", mobile: "01521536082", type: "Adjunct" },
            { name: "Mohammad Afjalur Rahman", designation: "Adjunct Faculty, CCE, IIUC", short: "MAR", mobile: "01716742661", type: "Adjunct" },
            { name: "Md. Ziaul Hoque", designation: "Adjunct Faculty, CCE, IIUC", short: "MZH", mobile: "01518602747", type: "Adjunct" },
            { name: "Md Mahmudul Arif", designation: "Adjunct Faculty, CCE, IIUC", short: "MMA", mobile: "01789077979", type: "Adjunct" },
            { name: "MD. Ali Akbar", designation: "Lecturer, CSE, GAM", short: "MAA", mobile: "01791138588", type: "Adjunct" },
            { name: "Abu Monsur Mohammad Fahim", designation: "Software Engineering", short: "AMMF", mobile: "01821569161", type: "Adjunct" },
            { name: "Md. Ismail", designation: "Adjunct Faculty, CSE, IIUC", short: "MI", mobile: "01690068050", type: "Adjunct" },
            { name: "Farhana Ahmmed", designation: "Adjunct Faculty, CCE, IIUC", short: "FA", mobile: "01839304202", type: "Adjunct" }
        ];

        let currentTheme = 'white';
        let currentFilter = 'all';
        let searchQuery = '';

        const themes = ['white', 'dark-red', 'dark-black'];
        const grid = document.getElementById('teachersGrid');
        const searchInput = document.getElementById('searchInput');
        const themeBtn = document.getElementById('themeToggle');
        const themeIconPath = document.getElementById('iconPath');
        const noResults = document.getElementById('noResults');

        function render() {
            const filtered = facultyData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                    item.designation.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    item.short.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesType = currentFilter === 'all' || item.type === currentFilter;
                return matchesSearch && matchesType;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            grid.innerHTML = filtered.map(teacher => `
                <div class="card rounded-2xl p-6 shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-12 h-12 rounded-xl flex items-center justify-center font-bold text-white shadow-lg ${teacher.type === 'Regular' ? 'bg-blue-600' : 'bg-purple-600'}">
                            ${teacher.short}
                        </div>
                        <span class="category-badge ${teacher.type === 'Regular' ? 'bg-blue-500' : 'bg-purple-500'}">${teacher.type}</span>
                    </div>
                    <h3 class="text-lg font-bold mb-1 leading-tight">${teacher.name}</h3>
                    <p class="accent-text text-sm font-semibold mb-4">${teacher.designation}</p>
                    
                    <div class="space-y-3 pt-4 border-t border-gray-400 border-opacity-20">
                        <a href="tel:${teacher.mobile}" class="flex items-center gap-3 text-sm hover:underline">
                            <svg class="w-4 h-4 accent-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                            ${teacher.mobile}
                        </a>
                        <div class="flex items-center gap-3 text-sm">
                            <svg class="w-4 h-4 accent-text" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                            CCE Dept.
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleTheme() {
            const currentIndex = themes.indexOf(currentTheme);
            const nextIndex = (currentIndex + 1) % themes.length;
            const nextTheme = themes[nextIndex];
            
            document.body.className = `theme-${nextTheme}`;
            currentTheme = nextTheme;

            // Update Icons
            if (nextTheme === 'white') {
                themeIconPath.setAttribute('d', 'M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z');
            } else if (nextTheme === 'dark-red') {
                themeIconPath.setAttribute('d', 'M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z');
            } else {
                themeIconPath.setAttribute('d', 'M13 10V3L4 14h7v7l9-11h-7z');
            }
        }

        function filterCategory(cat) {
            currentFilter = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white');
                btn.classList.add('border-gray-400', 'border-opacity-30');
            });
            event.target.classList.add('bg-blue-600', 'text-white');
            event.target.classList.remove('border-gray-400', 'border-opacity-30');
            render();
        }

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        themeBtn.addEventListener('click', toggleTheme);

        // Initial render
        render();
    </script>
</body>
</html>
